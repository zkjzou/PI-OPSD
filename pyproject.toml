[project]
name = "opsd"
version = "0.1.0"
description = "On-policy self-distillation with privileged information for long-horizon agents (ALFWorld, AppWorld, tau2-bench), built on SkyRL"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kaijian Zou" }]
dependencies = [
    # SkyRL @ ecdaa946 (NovaSky-AI/SkyRL, unmodified), an editable checkout next to this repository: see
    # [tool.uv.sources]. Not from PyPI: uv only honors this file's custom sources/indexes for a path
    # dependency's requirements, so a registry skyrl would pull its GPU stack from PyPI.
    # The training backend comes from an extra: --extra fsdp (every 4B student) or --extra megatron (the 30B).
    "skyrl",
    # imported directly; listed so that [tool.uv.sources] picks its index per platform (cu128 / cpu), which
    # uv applies only to the root project's own requirements. Its version comes from skyrl's extras.
    "torch",
    # what the opsd package imports beyond SkyRL (PI generation / analyzers / labelers, the tau2 user simulator
    # and judge, plotting and parquet I/O), at their versions in SkyRL's uv.lock
    "litellm==1.83.0",
    "openai==2.30.0",
    "tenacity==9.1.4",
    "matplotlib==3.10.8",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "pyyaml==6.0.3",
    "huggingface-hub==1.9.1",
]

[project.optional-dependencies]
fsdp = ["skyrl[fsdp]"]
megatron = ["skyrl[megatron]"]
# tau2-bench's import-time dependencies. tau2 itself is never installed (its own litellm pin conflicts with
# the training environment): opsd.tau2_bench puts the pinned tau2-bench checkout on sys.path.
tau2 = [
    "addict==2.4.0",
    "deepdiff==9.1.0",
    "orderly-set==5.5.0",
    "cachebox==6.2.0", # deepdiff 9.1.0 declares cachebox<6: overridden below
    "toml==0.10.2",
]
# the test suite and the pre-commit hooks (the subset of SkyRL's dev extra this repository uses)
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-forked",
    "pre-commit",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# the package with every data file it reads at runtime (recipes/*.env|yaml, tau2_bench/data/*.jsonl, *.jinja2,
# appworld/official_react_instructions.txt, ...); the repository-level tests and fixtures stay out
packages = ["opsd"]
exclude = ["opsd/tests"]

# ------------------------------------------------------------------------------------------------------------
# Mirrors SkyRL's pyproject at the pinned commit (ecdaa946). Required because uv only honors the ROOT project's
# sources/indexes/overrides/constraints: skyrl's own [tool.uv.*] is ignored once it is a dependency.
# Differences: conflicts are expressed on this project's extras; the jax-tpu index and the harbor source are
# dropped (only SkyRL extras this project never enables use them). constraint-dependencies additionally pins
# every package to its version in SkyRL's uv.lock wherever this smaller resolution would pick another one, so
# the environment is exactly the one the paper's runs used. scripts/release_guard/check_lock_drift.py checks
# uv.lock against SkyRL's uv.lock (CI runs it after `uv lock --check`; --suggest prints missing pins).
# Re-sync all of this when bumping the SkyRL pin: ADAPTED_FROM_SKYRL.md, "Bumping the SkyRL pin".
# ------------------------------------------------------------------------------------------------------------
[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
constraint-dependencies = [
    "flashinfer-jit-cache==0.6.8.post1",
    "flashinfer-cubin==0.6.8.post1",
    # transitive dependencies of the opsd pins above, at their SkyRL uv.lock versions
    "fastuuid==0.14.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "kiwisolver==1.5.0",
    "pyparsing==3.3.2",
    # SkyRL's lock resolves torch 2.11.0 for every platform (+cu128 on linux, +cpu / cpu index on macOS); its
    # 2.7.0 is the flashrl extra's. The fsdp / megatron extras pin it on linux only.
    "torch==2.11.0",
    # >>> SkyRL uv.lock versions of every package a fresh resolution would otherwise move (generated) >>>
    "absl-py==2.4.0",
    "accelerate==1.13.0",
