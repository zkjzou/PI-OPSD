# Text-only AlfredTWEnv base config for the standalone ALFWorld server.
# Copied from SDAR agent_system/environments/env_package/alfworld/configs/config_tw.yaml
# (verl-agent / GiGPO lineage), trimmed to what AlfredTWEnv.collect_game_files / init_env read.
# Paths use $ALFWORLD_DATA, resolved at load time via os.path.expandvars.

dataset:
  data_path: '$ALFWORLD_DATA/json_2.1.1/train'
  eval_id_data_path: '$ALFWORLD_DATA/json_2.1.1/valid_seen'    # null/None to disable
  eval_ood_data_path: '$ALFWORLD_DATA/json_2.1.1/valid_unseen' # null/None to disable
  num_train_games: -1                                          # max training games (<=0 indicates full dataset)
  num_eval_games: -1                                           # max evaluation games (<=0 indicates full dataset)

logic:
  domain: '$ALFWORLD_DATA/logic/alfred.pddl'                   # PDDL domain file that defines the world dynamics
  grammar: '$ALFWORLD_DATA/logic/alfred.twl2'                  # Grammar file that defines the text feedbacks

env:
  type: 'AlfredTWEnv'                                          # 'AlfredTWEnv' (text) or 'AlfredThorEnv' (vision, out of scope)
  domain_randomization: False                                  # shuffle Textworld print order and object id nums
  task_types: [1, 2, 3, 4, 5, 6]                               # 1 Pick&Place, 2 Examine-in-Light, 3 Clean&Place, 4 Heat&Place, 5 Cool&Place, 6 Pick-Two&Place
  expert_timeout_steps: 150                                    # max steps before timeout for expert to solve the task
  expert_type: "handcoded"                                     # 'handcoded' or 'planner' (planner is very slow)
  goal_desc_human_anns_prob: 0.0                               # prob of human-annotated goal language (1.0 = all ALFRED human anns)

  hybrid:
    start_eps: 100000
    thor_prob: 0.5
    eval_mode: "tw"

  thor:
    screen_width: 300
    screen_height: 300
    smooth_nav: False
    save_frames_to_disk: False
    save_frames_path: './videos/'

controller:
  type: 'oracle'                                               # 'oracle' or 'oracle_astar' or 'mrcnn' or 'mrcnn_astar'
  debug: False
  load_receps: True

mask_rcnn:
  pretrained_model_path: '$ALFWORLD_DATA/detectors/mrcnn.pth'

general:
  random_seed: 42
  use_cuda: False                                              # text-only server: no CUDA needed
  visdom: False
  task: 'alfred'
  training_method: 'dagger'                                    # 'dqn' or 'dagger' (selects max_nb_steps_per_episode source)
  save_path: './training/'
  observation_pool_capacity: 3
  hide_init_receptacles: False

  training:
    batch_size: 10
    max_episode: 50000
    smoothing_eps: 0.1
    optimizer:
      learning_rate: 0.001
      clip_grad_norm: 5

  evaluate:
    run_eval: True
    batch_size: 10
    env:
      type: "AlfredTWEnv"

  checkpoint:
    report_frequency: 1000
    experiment_tag: 'test'
    load_pretrained: False
    load_from_tag: 'not loading anything'

  model:
    encoder_layers: 1
    decoder_layers: 1
    encoder_conv_num: 5
    block_hidden_dim: 64
    n_heads: 1
    dropout: 0.1
    block_dropout: 0.1
    recurrent: True

rl:
  action_space: "admissible"
  max_target_length: 20
  beam_width: 10
  generate_top_k: 3

  training:
    max_nb_steps_per_episode: 50                              # terminate after this many steps (dqn path)
    learn_start_from_this_episode: 0
    target_net_update_frequency: 500

  replay:
    accumulate_reward_from_final: True
    count_reward_lambda: 0.0
    novel_object_reward_lambda: 0.0
    discount_gamma_game_reward: 0.9
    discount_gamma_count_reward: 0.5
    discount_gamma_novel_object_reward: 0.5
    replay_memory_capacity: 500000
    replay_memory_priority_fraction: 0.5
    update_per_k_game_steps: 5
    replay_batch_size: 64
    multi_step: 3
    replay_sample_history_length: 4
    replay_sample_update_from: 2

  epsilon_greedy:
    noisy_net: False
    epsilon_anneal_episodes: 1000
    epsilon_anneal_from: 0.3
    epsilon_anneal_to: 0.1

dagger:
  action_space: "generation"
  max_target_length: 20
  beam_width: 10
  generate_top_k: 5
  unstick_by_beam_search: False

  training:
    max_nb_steps_per_episode: 50                              # terminate after this many steps (dagger path; AlfredTWEnv reads this)

  fraction_assist:
    fraction_assist_anneal_episodes: 50000
    fraction_assist_anneal_from: 1.0
    fraction_assist_anneal_to: 0.01

  fraction_random:
    fraction_random_anneal_episodes: 0
    fraction_random_anneal_from: 0.0
    fraction_random_anneal_to: 0.0

  replay:
    replay_memory_capacity: 500000
    update_per_k_game_steps: 5
    replay_batch_size: 64
    replay_sample_history_length: 4
    replay_sample_update_from: 2

vision_dagger:
  model_type: "resnet"
  resnet_fc_dim: 64
  maskrcnn_top_k_boxes: 10
  use_exploration_frame_feats: False
  sequence_aggregation_method: "average"
