# tau2 privileged-information (PI) hint files, per student, as used by the main table (vanilla OPSD).
#   hint            path relative to $OPSD_DATA_ROOT (the unpacked data bundle) -> OPSD_HINTS_PATH
#   ref_seq_cap     OPSD_REF_SEQ_CAP the run used: the bound on |hint + prompt + response| of the teacher
#                   forward. With OPSD_REQUIRE_HINT=1 an over-cap episode is an error, never a silent drop,
#                   so the cap is a guard: a run that completes computes the same thing under any cap it
#                   never reaches. Where a larger value is kept on purpose, the comment next to it says so.
#   content_sha256  sha256 of the canonical {task_id: hint} JSON (checked by preflight; = bundle manifest)
#   env             per-student settings tied to the artifact (checklists cover a student-specific pool)
# Forms: a = actions only, ao = actions + observations (raw trajectory without the author's reasoning),
# aot = actions + observations + thoughts (raw trajectory), aat = actions + thoughts (no observations),
# skill = on-policy skill analysis of the reference trajectory, summ = plain summary, chk = checklist
# (winning vs losing rollout). Every author/analyzer read the same GLM-5.2 reference trajectories except
# the qwen trajectory forms (a/ao/aot/aat), which render Qwen3.7-Plus's own trajectories.
# Action+Thoughts (glm_aat, qwen_aat) is not a row of the paper's main table; those arms are training runs
# reported alongside it (see arms.yaml).
# Other tables override hint/cap/pool through their table env (see arms.yaml).

