# AppWorld privileged-information (PI) hint files, per student.
#   hint            path relative to $OPSD_DATA_ROOT -> OPSD_HINTS_PATH. Every AppWorld file ships inside the
#                   ENCRYPTED bundle appworld/appworld_opsd_pi.bundle (AppWorld's license requires encrypted
#                   redistribution of anything derived from its task data);
#                   scripts/setup/setup_appworld.sh unpacks it into appworld/plain/ (original names).
#   content_sha256  sha256 of the canonical {task_id: hint} JSON (= the bundle's CONTENTS.json); checked by
#                   the launcher's preflight before a run starts.
# Every PI covers the 90 AppWorld train tasks (Qwen3.7-Plus trajectories: 89; a train task without a hint
# gets the generic static hint, as in the runs).
# Forms: a = executed code only, ao = code + observations, aot = code + observations + the author's
# reasoning (the raw trajectory), aat = code + reasoning (no observations); skill = "on-policy skill"
# analysis and summ = plain summary, both written by an analyzer FROM THE GLM-5.2 REFERENCE TRAJECTORY
# (the "on-policy" name is historical); chk = checklist contrasting the GLM-5.2 win with the student's own
# failed rollouts (built with the scaffold's demo task line -- a known defect kept for reproduction).
# self = the student itself is the analyzer; the checklist and self files are student-specific.
# The teacher-forward cap OPSD_REF_SEQ_CAP is set per objective/table (arms.yaml), not here.

