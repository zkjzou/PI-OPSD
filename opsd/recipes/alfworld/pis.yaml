# ALFWorld privileged-information (PI) registry: pi_id -> per-student hint file under $OPSD_DATA_ROOT.
#
# Naming: <author>_<form>. Authors: glm = GLM-5.2, qwen = Qwen3.7-Plus (reference-trajectory authors),
# self = the student itself writes the hint from the GLM reference trajectory. Forms: a = Action,
# ao = Action+Obs., aot = Action+Obs.+Thou., aat = Action+Thou., skill = on-policy skill, summ = summarised
# reference, chk = checklist. The trajectory renders are capped at 24k characters (`_cap24k`), and the
# teacher's reference sequence cap is raised to 65536 tokens for every PI except the short action lists.
# Student-dependent files: the thinking student (4bt) reads the reference thoughts from the <think> render
# (`withthink` / `actthink`) instead of the THOUGHTS: render; checklists and self-written PIs are built per
# student.
#
# content_sha256 = sha256 of the canonical {task_id: task hint} JSON the trainer reads (the data-bundle
# manifest value); the launcher's preflight refuses a hint file whose content does not match.
#
# Caveat for every reference-trajectory PI (a/ao/aot/aat and everything derived from them): the reference
# runs showed the admissible-action list after an invalid action, and that list appears inside ~45% of the
# raw renders.

