  # dataset's appworld/appworld_opsd_xdnull.bundle (batch 3b); scripts/setup/setup_appworld.sh decrypts it to
  # the path below (fetch the bundle first: python -m opsd.data.fetch ... --bench appworld --include
  # appworld/appworld_opsd_xdnull.bundle). Built by scripts/analysis/build_pi_crossdomain_hints.py with pooled
  # tau2 + AppWorld donors (see its docstring).
  # EVALUATION-SPLIT MATERIAL: the keys are ALFWorld train tasks, but the AppWorld donor text is the reference
  # solution of AppWorld test_normal tasks. A model trained on this arm has seen AppWorld test_normal solutions
  # through its teacher: never evaluate it (or use this file as a hint source for a model you evaluate) on
  # AppWorld test_normal. The arm reproduces the paper's control.
  4bi:
    hint: appworld/plain/opsd_appworld_xdnull/alfworld/glt_xdmix_tau2_appworld.json
    ref_seq_cap: 65536
